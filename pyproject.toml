[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-contract-fuzzer"
version = "0.1.0"
description = "Deterministic property-style fuzzing for JSON-schema tool contracts, including invalid-call generation and failure shrinking."
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "yashkhou"}]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
